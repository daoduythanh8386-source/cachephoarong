<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="t d"><title id="t">Cá chép vàng cam</title><desc id="d">Cá chép phong cách minh họa cao cấp với vảy ánh kim, vây dài và đuôi xòe.</desc><defs>
 <linearGradient id="body" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#fff3c5"/><stop offset=".22" stop-color="#f9cf70"/><stop offset=".52" stop-color="#ee8d32"/><stop offset=".78" stop-color="#bd4d20"/><stop offset="1" stop-color="#6e2d1d"/></linearGradient>
 <linearGradient id="gold" x1="0" y1="0" x2=".9" y2="1"><stop stop-color="#fff1a8"/><stop offset=".35" stop-color="#eeb14a"/><stop offset=".7" stop-color="#c66a25"/><stop offset="1" stop-color="#7f321b"/></linearGradient>
 <linearGradient id="fin" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff1bf" stop-opacity=".95"/><stop offset=".45" stop-color="#ef9c42" stop-opacity=".8"/><stop offset="1" stop-color="#a83c24" stop-opacity=".5"/></linearGradient>
 <radialGradient id="shine"><stop stop-color="#fffbdc" stop-opacity=".9"/><stop offset="1" stop-color="#fffbdc" stop-opacity="0"/></radialGradient>
