 <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="13"/></filter>
 <clipPath id="bodyClip"><path d="M180 274 C250 165 430 144 598 210 C660 235 704 272 736 302 C680 338 623 374 551 395 C389 445 244 389 180 310 C163 297 163 287 180 274Z"/></clipPath>
