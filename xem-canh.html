<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>100 cảnh nền · Cá Chép Vượt Vũ Môn</title>
<style>
  body{margin:0;background:#06131c;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  header{position:sticky;top:0;z-index:2;padding:12px 14px;background:rgba(6,19,28,.92);backdrop-filter:blur(8px);border-bottom:1px solid rgba(255,230,170,.2)}
  h1{margin:0;font-size:18px;color:#f6c453}
  header p{margin:4px 0 0;font-size:12.5px;opacity:.8}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;padding:10px}
  .tile{position:relative;aspect-ratio:9/16;border-radius:12px;overflow:hidden;background:#123;cursor:pointer}
  .tile img{width:100%;height:100%;object-fit:cover;filter:saturate(1.28) contrast(1.07) brightness(1.04);transition:transform .4s}
  .tile:hover img{transform:scale(1.05)}
  .tile .cap{position:absolute;left:0;right:0;bottom:0;padding:22px 8px 7px;background:linear-gradient(transparent,rgba(0,0,0,.8));font-size:12.5px;line-height:1.3}
  .tile .cap b{display:block;color:#ffe7a3}
  .tile .n{position:absolute;left:6px;top:6px;font-size:11px;background:rgba(0,0,0,.55);padding:2px 6px;border-radius:8px}
  .full{position:fixed;inset:0;z-index:5;background:#000;display:none}
  .full.on{display:block}
  .full img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:saturate(1.28) contrast(1.07) brightness(1.04)}
  .full .info{position:absolute;left:0;right:0;bottom:0;padding:40px 16px calc(env(safe-area-inset-bottom,0px) + 16px);background:linear-gradient(transparent,rgba(0,0,0,.85))}
  .full .info b{font-size:22px;color:#ffe7a3;display:block}
  .full .info small{opacity:.75;font-size:11px}
  .full .info a{color:#9fe3ff}
  .full .x{position:absolute;right:12px;top:calc(env(safe-area-inset-top,0px) + 12px);width:42px;height:42px;border-radius:50%;border:0;background:rgba(0,0,0,.5);color:#fff;font-size:20px}
</style>
</head>
<body>
<header>
  <h1>100 danh lam thắng cảnh · khung dọc 9:16</h1>
  <p>Ảnh chụp thật từ Wikimedia Commons, cắt khung dọc giống trong game. Chạm vào ảnh để xem toàn màn hình.</p>
</header>
<div class="grid" id="grid"></div>
<div class="full" id="full"><img id="fimg" alt=""><button class="x" id="fx" aria-label="Đóng">✕</button><div class="info"><b id="fname"></b><span id="fplace"></span><br><small id="fcredit"></small></div></div>
<script src="js/scenes.js"></script>
<script>
  const S = window.SCENES_100, g = document.getElementById('grid');
  const thumb = s => s.url.includes('/thumb/') ? s.url.replace(/\/(1280|1920)px-/, '/500px-') : s.url;
  S.forEach((s, i) => {
    const d = document.createElement('div'); d.className = 'tile';
    d.innerHTML = `<img loading="lazy" alt=""><span class="n">${i + 1}</span><div class="cap"><b></b><span></span></div>`;
    d.querySelector('img').src = thumb(s);
    d.querySelector('b').textContent = s.name; d.querySelector('.cap span').textContent = s.place;
    d.onclick = () => {
      document.getElementById('fimg').src = s.url;
      document.getElementById('fname').textContent = s.name;
      document.getElementById('fplace').textContent = s.place;
      document.getElementById('fcredit').innerHTML = s.credit.replace(/[<>&]/g, '') + (s.link ? ` · <a href="${s.link}" target="_blank" rel="noopener">nguồn</a>` : '');
      document.getElementById('full').classList.add('on');
    };
    g.appendChild(d);
  });
  document.getElementById('fx').onclick = () => document.getElementById('full').classList.remove('on');
</script>
</body>
</html>
